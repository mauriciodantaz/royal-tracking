# Create this stack ONLY in Portainer Web UI (Stacks → Add stack → Web editor).
# Do NOT create the stack via SSH CLI (Portainer UI edits break on CLI-created stacks).
# Git copy uses placeholders for secrets. For Portainer, paste the filled YAML from the delivery guide.
#
# Stack name in Portainer: royaltracking_<SLUG>  (ex.: royaltracking_dev)
# service auto-detect: royaltracking_<SLUG>_app
# network name and Traefik Host follow the target VPS reference YAML.
version: "3.7"

services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - /var/lib/docker/volumes/royaltracking_<SLUG>/_data:/app
    networks:
      - RoyalNet
    environment:
      # --- Runtime ---
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

      # --- Instância ---
      PROJECT_NAME: "<NOME_DO_PROJETO>"

      # --- Postgres (externo na RoyalNet) ---
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: royaltracking_<SLUG>
      DB_POSTGRESDB_PASSWORD: CHANGE_ME_DB_PASSWORD
      DB_POSTGRESDB_DATABASE: royaltracking_<SLUG>

      # --- Auth / crypto ---
      ENCRYPTION_KEY: CHANGE_ME_ENCRYPTION_KEY
      AUTH_SECRET: CHANGE_ME_AUTH_SECRET
      NEXTAUTH_URL: https://tracking.royalgrowth.com.br
      NEXT_PUBLIC_APP_URL: https://tracking.royalgrowth.com.br

      # --- Domínios / eventos ---
      ALLOWED_EVENT_DOMAINS: royalgrowth.com.br

      # --- Super admin (imutável — só stack) ---
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD

      # --- SMTP (convite, reset, alertas) ---
      SMTP_HOST: CHANGE_ME_SMTP_HOST
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: CHANGE_ME_SMTP_USER
      SMTP_PASS: CHANGE_ME_SMTP_PASS
      SMTP_FROM: "Royal Tracking <noreply@royalgrowth.com.br>"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.royaltracking_<SLUG>.rule=Host(`tracking.royalgrowth.com.br`)
        - traefik.http.services.royaltracking_<SLUG>.loadbalancer.server.port=3000
        - traefik.http.routers.royaltracking_<SLUG>.service=royaltracking_<SLUG>
        - traefik.http.routers.royaltracking_<SLUG>.tls.certresolver=letsencryptresolver
        - traefik.http.routers.royaltracking_<SLUG>.entrypoints=websecure
        - traefik.http.routers.royaltracking_<SLUG>.tls=true

networks:
  RoyalNet:
    external: true
    name: RoyalNet
