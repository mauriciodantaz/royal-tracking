version: "3.8"

# Stack Portainer / Swarm — Royal Tracking (self-hosted, imagem Hub)
# Domínio produção RoyalServer: https://tracking.royalserver.com.br
# Rede Traefik: RoyalNet
#
# Substitua CHANGE_ME_* antes do deploy (ou use install.sh).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
      POSTGRES_DB: tracking
    volumes:
      - royal_tracking_pg:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  app:
    image: royalserver/royal-tracking:latest
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://tracking:CHANGE_ME_DB_PASSWORD@postgres:5432/tracking
      ENCRYPTION_KEY: CHANGE_ME_ENCRYPTION_KEY_MIN_32_CHARS
      AUTH_SECRET: CHANGE_ME_AUTH_SECRET_MIN_32_CHARS
      NEXTAUTH_URL: https://tracking.royalserver.com.br
      NEXT_PUBLIC_APP_URL: https://tracking.royalserver.com.br
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD
    networks:
      - internal
      - RoyalNet
    depends_on:
      - postgres
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.royal-tracking.rule=Host(`tracking.royalserver.com.br`)
        - traefik.http.services.royal-tracking.loadbalancer.server.port=3000
        - traefik.http.routers.royal-tracking.service=royal-tracking
        - traefik.http.routers.royal-tracking.tls.certresolver=letsencryptresolver
        - traefik.http.routers.royal-tracking.entrypoints=websecure
        - traefik.http.routers.royal-tracking.tls=true

networks:
  internal:
    driver: overlay
  RoyalNet:
    external: true
    name: RoyalNet

volumes:
  royal_tracking_pg:
