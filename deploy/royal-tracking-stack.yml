version: "3.8"

# Template — imagem Hub, naming royaltracking_<SLUG>
# Preferível: ROYAL_TRACKING_BUILD_ON_VPS=0 bash install.sh

services:
  app:
    image: royalserver/royal-tracking:latest
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://royaltracking_<SLUG>:CHANGE_ME@postgres:5432/royaltracking_<SLUG>
      ENCRYPTION_KEY: CHANGE_ME_ENCRYPTION_KEY_MIN_32_CHARS
      AUTH_SECRET: CHANGE_ME_AUTH_SECRET_MIN_32_CHARS
      NEXTAUTH_URL: https://<DOMAIN>
      NEXT_PUBLIC_APP_URL: https://<DOMAIN>
      ALLOWED_EVENT_DOMAINS: <APEX_DOMAIN>
      # Super admin (imutável — só stack)
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD
      # SMTP (convite, reset, alertas)
      SMTP_HOST: CHANGE_ME_SMTP_HOST
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: CHANGE_ME_SMTP_USER
      SMTP_PASS: CHANGE_ME_SMTP_PASS
      SMTP_FROM: "Royal Tracking <noreply@example.com>"
    networks:
      - RoyalNet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.royaltracking_<SLUG>.rule=Host(`<DOMAIN>`)
        - traefik.http.services.royaltracking_<SLUG>.loadbalancer.server.port=3000
        - traefik.http.routers.royaltracking_<SLUG>.service=royaltracking_<SLUG>
        - traefik.http.routers.royaltracking_<SLUG>.tls.certresolver=letsencryptresolver
        - traefik.http.routers.royaltracking_<SLUG>.entrypoints=websecure
        - traefik.http.routers.royaltracking_<SLUG>.tls=true

networks:
  RoyalNet:
    external: true
    name: RoyalNet
