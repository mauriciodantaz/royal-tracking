version: "3.8"

# Template Portainer (OSS) — imagem Docker Hub
# Imagem: mauriciodantaz/royal-tracking:latest  (estável)
#         mauriciodantaz/royal-tracking:beta    (pré-release)
#         mauriciodantaz/royal-tracking:vX.Y.Z  (versão pinada)
#
# Naming: stack / serviço / DB = royaltracking_<SLUG>
# 1) Substitua placeholders  2) Colar no Portainer → Deploy
# Postgres fica em stack EXTERNA na mesma rede (ex.: RoyalNet).

services:
  app:
    image: mauriciodantaz/royal-tracking:latest
    environment:
      # --- Runtime ---
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: America/Sao_Paulo

      # --- Instância ---
      PROJECT_NAME: "<NOME_DO_PROJETO>"

      # --- Postgres (externo na RoyalNet) ---
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: royaltracking_<SLUG>
      DB_POSTGRESDB_PASSWORD: CHANGE_ME
      DB_POSTGRESDB_DATABASE: royaltracking_<SLUG>

      # --- Auth / crypto ---
      ENCRYPTION_KEY: CHANGE_ME_ENCRYPTION_KEY_MIN_32_CHARS
      AUTH_SECRET: CHANGE_ME_AUTH_SECRET_MIN_32_CHARS
      NEXTAUTH_URL: https://<DOMAIN>
      NEXT_PUBLIC_APP_URL: https://<DOMAIN>

      # --- Domínios / eventos ---
      ALLOWED_EVENT_DOMAINS: <APEX_DOMAIN>

      # --- Super admin (imutável — só stack) ---
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD

      # --- SMTP (convite, reset, alertas) ---
      SMTP_HOST: CHANGE_ME_SMTP_HOST
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: CHANGE_ME_SMTP_USER
      SMTP_PASS: CHANGE_ME_SMTP_PASS
      SMTP_FROM: "Royal Tracking <noreply@example.com>"
    networks:
      - RoyalNet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.royaltracking_<SLUG>.rule=Host(`<DOMAIN>`)
        - traefik.http.services.royaltracking_<SLUG>.loadbalancer.server.port=3000
        - traefik.http.routers.royaltracking_<SLUG>.service=royaltracking_<SLUG>
        - traefik.http.routers.royaltracking_<SLUG>.tls.certresolver=letsencryptresolver
        - traefik.http.routers.royaltracking_<SLUG>.entrypoints=websecure
        - traefik.http.routers.royaltracking_<SLUG>.tls=true

networks:
  RoyalNet:
    external: true
    name: RoyalNet
