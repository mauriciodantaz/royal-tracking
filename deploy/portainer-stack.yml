version: "3.7"

# Stack Portainer — Royal Tracking (só o app)
# Domínio: https://tracking.royalserver.com.br
# Rede: RoyalNet (mesma do Traefik + Postgres externo)
#
# Postgres NÃO fica nesta stack — use a stack Postgres da VPS (como o n8n).
# No .env: DATABASE_URL=postgresql://USER:SENHA@HOST_DO_POSTGRES:5432/tracking
#
# Pré-requisitos:
#   1) DB + user criados no Postgres externo
#   2) mkdir -p /var/lib/docker/volumes/tracking/_data
#   3) /root/projects/tracking/.env
#   4) ./deploy.sh (preenche o volume com standalone + migrations)
#
# Swarm não usa env_file; o entrypoint carrega /app/.env do volume.

services:
  tracking:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -a
        [ -f /app/.env ] && . /app/.env
        set +a
        exec node server.js
    volumes:
      - /var/lib/docker/volumes/tracking/_data:/app
    networks:
      - RoyalNet
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.tracking.rule=Host(`tracking.royalserver.com.br`)
        - traefik.http.services.tracking.loadbalancer.server.port=3000
        - traefik.http.routers.tracking.service=tracking
        - traefik.http.routers.tracking.tls.certresolver=letsencryptresolver
        - traefik.http.routers.tracking.entrypoints=websecure
        - traefik.http.routers.tracking.tls=true

networks:
  RoyalNet:
    external: true
    name: RoyalNet
