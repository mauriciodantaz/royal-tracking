version: "3.7"

# Template Portainer — Royal Tracking (env no YAML, padrão n8n)
# Naming: royaltracking_<SLUG>
#
# Preferível gerar com secrets reais:
#   cd /root/projects/royaltracking_<SLUG>
#   bash deploy/print-stack-yml.sh
#
# Volume só com o build (deploy.sh). Secrets ficam no environment abaixo.

services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - /var/lib/docker/volumes/royaltracking_<SLUG>/_data:/app
    networks:
      - RoyalNet
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://royaltracking_<SLUG>:CHANGE_ME@postgres:5432/royaltracking_<SLUG>
      ENCRYPTION_KEY: CHANGE_ME_ENCRYPTION_KEY
      AUTH_SECRET: CHANGE_ME_AUTH_SECRET
      NEXTAUTH_URL: https://<DOMAIN>
      NEXT_PUBLIC_APP_URL: https://<DOMAIN>
      ALLOWED_EVENT_DOMAINS: <APEX_DOMAIN>
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.royaltracking_<SLUG>.rule=Host(`<DOMAIN>`)
        - traefik.http.services.royaltracking_<SLUG>.loadbalancer.server.port=3000
        - traefik.http.routers.royaltracking_<SLUG>.service=royaltracking_<SLUG>
        - traefik.http.routers.royaltracking_<SLUG>.tls.certresolver=letsencryptresolver
        - traefik.http.routers.royaltracking_<SLUG>.entrypoints=websecure
        - traefik.http.routers.royaltracking_<SLUG>.tls=true

networks:
  RoyalNet:
    external: true
    name: RoyalNet
