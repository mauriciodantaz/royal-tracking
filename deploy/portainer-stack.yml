version: "3.7"

# Template Portainer — Royal Tracking
# Naming: royaltracking_<projeto>
#
# Substitua:
#   <SLUG>     → slug do projeto (ex: royalserver, fizzing)
#   <DOMAIN>   → tracking.royalserver.com.br
#
# Prefixo completo: royaltracking_<SLUG>
# Stack name no Portainer: royaltracking_<SLUG>
# Serviço Swarm: royaltracking_<SLUG>_app
# Volume: /var/lib/docker/volumes/royaltracking_<SLUG>/_data
# DB/user (Postgres externo): royaltracking_<SLUG>
#
# Preferível: bash install.sh (gera tudo sozinho).
#
# Postgres NÃO fica nesta stack — stack externa na RoyalNet.
# .env no volume (deploy.sh) com DATABASE_URL apontando ao PG externo.

services:
  app:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -a
        [ -f /app/.env ] && . /app/.env
        set +a
        exec node server.js
    volumes:
      - /var/lib/docker/volumes/royaltracking_<SLUG>/_data:/app
    networks:
      - RoyalNet
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.royaltracking_<SLUG>.rule=Host(`<DOMAIN>`)
        - traefik.http.services.royaltracking_<SLUG>.loadbalancer.server.port=3000
        - traefik.http.routers.royaltracking_<SLUG>.service=royaltracking_<SLUG>
        - traefik.http.routers.royaltracking_<SLUG>.tls.certresolver=letsencryptresolver
        - traefik.http.routers.royaltracking_<SLUG>.entrypoints=websecure
        - traefik.http.routers.royaltracking_<SLUG>.tls=true

networks:
  RoyalNet:
    external: true
    name: RoyalNet
