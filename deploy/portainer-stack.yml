version: "3.8"

# Stack Portainer — Royal Tracking (build na VPS + Postgres local)
# Domínio: https://tracking.royalserver.com.br
# Rede Traefik: RoyalNet
#
# Pré-requisitos:
#   bash bootstrap-vps.sh   # cria pastas, volume, .env, stack, 1º build
#   ou manualmente:
#     mkdir -p /var/lib/docker/volumes/tracking/_data /root/projects/tracking
#     # .env em /root/projects/tracking/.env
#     # deploy.sh preenche o volume com o standalone
#
# O deploy.sh copia build standalone + db/migrations + .env para o volume.
# Swarm não usa env_file; o entrypoint carrega /app/.env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracking
      # Mesma senha usada em DATABASE_URL do .env da app
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
      POSTGRES_DB: tracking
    volumes:
      - tracking_pg:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  tracking:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -a
        [ -f /app/.env ] && . /app/.env
        set +a
        exec node server.js
    volumes:
      - /var/lib/docker/volumes/tracking/_data:/app
    networks:
      - internal
      - RoyalNet
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.tracking.rule=Host(`tracking.royalserver.com.br`)
        - traefik.http.services.tracking.loadbalancer.server.port=3000
        - traefik.http.routers.tracking.service=tracking
        - traefik.http.routers.tracking.tls.certresolver=letsencryptresolver
        - traefik.http.routers.tracking.entrypoints=websecure
        - traefik.http.routers.tracking.tls=true

networks:
  internal:
    driver: overlay
  RoyalNet:
    external: true
    name: RoyalNet

volumes:
  tracking_pg:
