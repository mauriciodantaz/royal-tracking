name: Docker publish

# Tag padrão Hub / GitHub:
#   Stable (main):  X.Y.Z  +  X.Y.Z-stable  +  stable  +  latest
#   Beta   (beta):  X.Y.Z-beta  +  beta
# latest == sempre a stable atual. Sem prefixo "v", sem tags com sha.

on:
  push:
    branches:
      - beta
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal a publicar"
        required: true
        type: choice
        options:
          - beta
          - stable
          - both

permissions:
  contents: read

env:
  IMAGE_NAME: mauriciodantaz/royal-tracking

jobs:
  publish-beta:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.channel == 'beta' || github.event.inputs.channel == 'both'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'beta' || github.sha }}

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version inválida: $version (esperado X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_beta=${version}-beta" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push beta
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:beta
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version_beta }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-stable-tag:
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag inválida: $version (esperado X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push stable + latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-stable
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-stable-manual:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.channel == 'stable' || github.event.inputs.channel == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push stable + latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-stable
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
