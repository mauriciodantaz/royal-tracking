name: Docker publish

# Canais Docker Hub (sem deploy VPS):
#   workflow_dispatch channel=beta (disparado por release.yml apos merge em beta)
#     -> :beta + :X.Y.Z-beta
#   tag X.Y.Z (humano/PAT) OU workflow_dispatch channel=stable (release.yml)
#     -> :X.Y.Z + :stable + :latest; apaga :X.Y.Z-beta no Hub (uma imagem tip por SemVer)
#   Push em `beta` NAO publica mais (evita build pre-bump + build pos-bump).
#   Push de tag com GITHUB_TOKEN tambem NAO dispara workflows — por isso o dispatch.
#   `dev` NAO publica imagem — so VPS via deploy.yml
# latest == sempre a stable atual. Sem prefixo "v", sem tags com sha, sem X.Y.Z-stable.

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal a publicar"
        required: true
        type: choice
        options:
          - beta
          - stable
          - both

permissions:
  contents: read

env:
  IMAGE_NAME: mauriciodantaz/royal-tracking

jobs:
  publish-beta:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.channel == 'beta' || github.event.inputs.channel == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version inválida: $version (esperado X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_beta=${version}-beta" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push beta
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            RELEASE_CHANNEL=beta
          tags: |
            ${{ env.IMAGE_NAME }}:beta
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version_beta }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-stable-tag:
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag inválida: $version (esperado X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push stable + latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            RELEASE_CHANNEL=latest
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete promoted beta tag on Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request

          user = os.environ["DOCKERHUB_USERNAME"]
          password = os.environ["DOCKERHUB_TOKEN"]
          image = os.environ["IMAGE_NAME"]
          tag = f'{os.environ["VERSION"]}-beta'

          def req(url, method="GET", data=None, headers=None):
              h = dict(headers or {})
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          status, login_raw = req(
              "https://hub.docker.com/v2/users/login/",
              method="POST",
              data={"username": user, "password": password},
          )
          if status != 200:
              raise SystemExit(f"login failed: {status} {login_raw!r}")
          token = json.loads(login_raw)["token"]
          auth = {"Authorization": f"JWT {token}"}
          url = f"https://hub.docker.com/v2/repositories/{image}/tags/{tag}/"
          st, body = req(url, method="DELETE", headers=auth)
          if st in (200, 202, 204):
              print(f"DELETE {tag} -> {st}")
          elif st == 404:
              print(f"SKIP {tag} (not found)")
          else:
              raise SystemExit(f"DELETE {tag} FAILED: {st} {body!r}")
          PY

  publish-stable-manual:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.channel == 'stable' || github.event.inputs.channel == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version inválida: $version (esperado X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push stable + latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            RELEASE_CHANNEL=latest
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete promoted beta tag on Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request

          user = os.environ["DOCKERHUB_USERNAME"]
          password = os.environ["DOCKERHUB_TOKEN"]
          image = os.environ["IMAGE_NAME"]
          tag = f'{os.environ["VERSION"]}-beta'

          def req(url, method="GET", data=None, headers=None):
              h = dict(headers or {})
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          status, login_raw = req(
              "https://hub.docker.com/v2/users/login/",
              method="POST",
              data={"username": user, "password": password},
          )
          if status != 200:
              raise SystemExit(f"login failed: {status} {login_raw!r}")
          token = json.loads(login_raw)["token"]
          auth = {"Authorization": f"JWT {token}"}
          url = f"https://hub.docker.com/v2/repositories/{image}/tags/{tag}/"
          st, body = req(url, method="DELETE", headers=auth)
          if st in (200, 202, 204):
              print(f"DELETE {tag} -> {st}")
          elif st == 404:
              print(f"SKIP {tag} (not found)")
          else:
              raise SystemExit(f"DELETE {tag} FAILED: {st} {body!r}")
          PY
