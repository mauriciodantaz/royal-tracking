name: Docker publish

on:
  push:
    branches:
      - beta
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal a publicar"
        required: true
        type: choice
        options:
          - beta
          - latest
          - both

permissions:
  contents: read

env:
  IMAGE_NAME: mauriciodantaz/royal-tracking

jobs:
  publish-beta:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/beta') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.channel == 'beta' || github.event.inputs.channel == 'both'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push beta
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:beta
            ${{ env.IMAGE_NAME }}:beta-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest + semver
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-latest-manual:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.channel == 'latest' || github.event.inputs.channel == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
