name: Deploy Royal Tracking

# Alvo: VPS RoyalServer
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
# Instância padrão: royaltracking_royalserver (ajuste se o slug for outro)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Pasta da instância na VPS (padrão naming royaltracking_<projeto>)
  INSTANCE_DIR: /root/projects/royaltracking_royalserver

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on RoyalServer VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ env.INSTANCE_DIR }}"
            ./deploy.sh
