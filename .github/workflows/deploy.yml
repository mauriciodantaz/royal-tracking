name: Deploy tracking

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-tracking
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            PROJECT_DIR="${{ vars.VPS_PROJECT_DIR }}"
            if [ -z "${PROJECT_DIR}" ]; then
              echo "ERROR: GitHub Actions variable VPS_PROJECT_DIR is empty."
              echo "Set it to /root/projects/royaltracking_<slug> (Settings → Variables)."
              exit 1
            fi
            cd "${PROJECT_DIR}"
            git config core.fileMode false
            git fetch origin dev
            git reset --hard origin/dev
            bash ops/deploy.sh
