name: Deploy Royal Tracking

# Alvo: VPS RoyalServer — https://tracking.royalserver.com.br
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
# Instância: royaltracking_dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  INSTANCE_DIR: /root/projects/royaltracking_dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on RoyalServer VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ env.INSTANCE_DIR }}"
            chmod +x deploy.sh install.sh bootstrap-vps.sh deploy/print-stack-yml.sh 2>/dev/null || true
            # VPS pode ter ROYAL_TRACKING_BRANCH legado (ex.: feat/self-hosted-oss).
            # Actions sempre publica main.
            export ROYAL_TRACKING_BRANCH=main
            ./deploy.sh
