name: Deploy Royal Tracking

# Alvo: VPS RoyalServer — https://tracking.royalserver.com.br
# Secrets: VPS_HOST (IP da nova VPS), VPS_USER, VPS_SSH_KEY

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on RoyalServer VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /root/projects/tracking/deploy.sh
