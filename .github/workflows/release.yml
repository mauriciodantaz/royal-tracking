name: Release SemVer

# Canais:
#   PR mergeada em `beta` + label release:*
#     -> bump package.json + CHANGELOG -> push em beta
#     -> tag git X.Y.Z-beta + GitHub Release (--prerelease, titulo "X.Y.Z (beta)")
#     -> workflow_dispatch docker-publish (:beta + :X.Y.Z-beta)
#       (push do GITHUB_TOKEN nao dispara outros workflows)
#   PR mergeada em `main` com head=`beta` (promocao; use merge commit, nao squash)
#     -> tag git X.Y.Z (mesma versao do package.json) + GitHub Release (titulo "X.Y.Z")
#     -> workflow_dispatch docker-publish (:X.Y.Z / :stable / :latest)
# Labels (obrigatorio em PR para beta — gate tambem em release-label.yml):
#   release:versao | release:melhoria | release:hotfix | release:none
# Push em `dev` nao usa este workflow.

on:
  pull_request:
    types: [closed]
    branches:
      - beta
      - main

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  bump-beta:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'beta'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release label
        id: label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Live labels (not the closed-event snapshot) so a missing label can be
          # fixed on the PR and the failed Release SemVer run re-run successfully.
          LABELS="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.labels[].name] | join(",")')"
          bump=""
          count=0
          IFS=',' read -ra parts <<< "${LABELS}"
          for l in "${parts[@]}"; do
            case "$l" in
              release:versão|release:versao)
                bump="major"
                count=$((count + 1))
                ;;
              release:melhoria)
                bump="minor"
                count=$((count + 1))
                ;;
              release:hotfix)
                bump="patch"
                count=$((count + 1))
                ;;
              release:none)
                bump="none"
                count=$((count + 1))
                ;;
            esac
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::PR merged to beta sem label release:* (versão|melhoria|hotfix|none)"
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::PR deve ter exatamente um label release:* (encontrou $count)"
            exit 1
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Skip bump for release:none
        if: steps.label.outputs.bump == 'none'
        run: echo "release:none — sem bump SemVer; docker-publish ainda roda na versao atual do package.json."

      - name: Checkout beta
        if: steps.label.outputs.bump != 'none'
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and changelog
        if: steps.label.outputs.bump != 'none'
        id: bump
        env:
          BUMP: ${{ steps.label.outputs.bump }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base="$(node -p "require('./package.json').version")"
          if ! echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version invalida: $base (esperado X.Y.Z)"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$base"
          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown bump: $BUMP" >&2
              exit 1
              ;;
          esac
          version="${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${version}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

          today="$(date -u +%Y-%m-%d)"
          export VERSION="$version" TODAY="$today" PR_TITLE PR_NUMBER
          python3 <<'PY'
          import os, re
          version = os.environ["VERSION"]
          today = os.environ["TODAY"]
          title = os.environ["PR_TITLE"]
          number = os.environ["PR_NUMBER"]
          section = f"## [{version}] - {today}\n\n### Changed\n\n- {title} (#{number})\n\n"
          path = "CHANGELOG.md"
          try:
              text = open(path, encoding="utf-8").read()
          except FileNotFoundError:
              text = "# Changelog\n\n"
          m = re.search(r"(?m)^## \[", text)
          if m:
              text = text[: m.start()] + section + text[m.start() :]
          else:
              text = text.rstrip() + "\n\n" + section
          open(path, "w", encoding="utf-8").write(text)
          PY

          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${version}-beta"
          git push origin HEAD:beta

      - name: Publish beta GitHub Release
        if: steps.label.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tag="${VERSION}-beta"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} ja existe — skip release."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"

          notes="$(mktemp)"
          {
            echo "## ${VERSION} (beta)"
            echo ""
            echo "${PR_TITLE} (#${PR_NUMBER})"
            echo ""
            echo "Docker Hub:"
            echo "- \`mauriciodantaz/royal-tracking:${VERSION}-beta\`"
            echo "- \`mauriciodantaz/royal-tracking:beta\`"
          } > "$notes"

          gh release create "$tag" \
            --prerelease \
            --title "${VERSION} (beta)" \
            --notes-file "$notes"

      # GITHUB_TOKEN pushes do not trigger other workflows — always dispatch.
      # Use -R: release:none skips checkout, so cwd is not a git repo.
      - name: Publish beta image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml -R "$GITHUB_REPOSITORY" -f channel=beta

  promote-main:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require promotion from beta
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" != "beta" ]; then
            echo "::error::Promoção para main deve ser PR head=beta (recebeu head=${HEAD_REF}). Use merge commit, não squash."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag stable from package.json
        id: tag
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="$(node -p "require('./package.json').version")"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version invalida: $version (esperado X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Tag ${version} ja existe — nada a promover."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

          git tag "$version"
          git push origin "$version"

          notes="$(mktemp)"
          {
            echo "## ${version}"
            echo ""
            echo "${PR_TITLE} (#${PR_NUMBER})"
            echo ""
            echo "Docker Hub:"
            echo "- \`mauriciodantaz/royal-tracking:${version}\`"
            echo "- \`mauriciodantaz/royal-tracking:${version}-stable\`"
            echo "- \`mauriciodantaz/royal-tracking:stable\`"
            echo "- \`mauriciodantaz/royal-tracking:latest\` (= stable)"
          } > "$notes"

          gh release create "$version" \
            --title "${version}" \
            --notes-file "$notes"

      # Tag push with GITHUB_TOKEN also does not trigger docker-publish.
      - name: Publish stable image
        if: steps.tag.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml -R "$GITHUB_REPOSITORY" -f channel=stable
